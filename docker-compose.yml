services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v360-order-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - APP_DATA_INITIALIZER_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
