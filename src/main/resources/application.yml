server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: purchase-order-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:v360_db}}
    driverClassName: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:v360_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:v360_pass}}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    show-sql: false
    open-in-view: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

security:
  jwt:
    secret: "v360-super-secure-jwt-signing-secret-key-for-hmac-sha256-production-ready"
    expiration-seconds: 86400
  clients:
    - client-id: "v360-platform"
      client-secret: "platform-secret-123"
      tenant-code: "PLATFORM"
      roles:
        - "ROLE_PLATFORM"
    - client-id: "alfa-client"
      client-secret: "alfa-secret-123"
      tenant-code: "CLI-ALFA-001"
      roles:
        - "ROLE_CLIENT"
    - client-id: "beta-client"
      client-secret: "beta-secret-123"
      tenant-code: "CLI-BETA-002"
      roles:
        - "ROLE_CLIENT"
    - client-id: "gama-client"
      client-secret: "gama-secret-123"
      tenant-code: "CLI-GAMA-003"
      roles:
        - "ROLE_CLIENT"

app:
  data-initializer:
    enabled: true
