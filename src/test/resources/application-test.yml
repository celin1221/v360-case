spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

security:
  jwt:
    secret: "v360-test-super-secure-jwt-signing-secret-key-for-hmac-sha256-test-only"
    expiration-seconds: 3600
  clients:
    - client-id: "v360-platform"
      client-secret: "platform-secret-123"
      tenant-code: "PLATFORM"
      roles:
        - "ROLE_PLATFORM"
    - client-id: "alfa-client"
      client-secret: "alfa-secret-123"
      tenant-code: "CLI-ALFA-001"
      roles:
        - "ROLE_CLIENT"
    - client-id: "beta-client"
      client-secret: "beta-secret-123"
      tenant-code: "CLI-BETA-002"
      roles:
        - "ROLE_CLIENT"
    - client-id: "gama-client"
      client-secret: "gama-secret-123"
      tenant-code: "CLI-GAMA-003"
      roles:
        - "ROLE_CLIENT"

app:
  data-initializer:
    enabled: false
